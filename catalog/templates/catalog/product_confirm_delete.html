{% extends "catalog/base.html" %}
{% load static %}
{% block title %}Удаление книги{% endblock %}

{% block content %}
<h2>Удаление книги</h2>
<p>Вы действительно хотите удалить {{  product.name }}</p>
<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">Подтвердить</button>
  <a href="{% url 'catalog:products_list' %}" class="btn btn-secondary">Отменить</a>
</form
{% endblock %}
