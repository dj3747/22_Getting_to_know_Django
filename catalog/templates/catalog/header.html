<header>
    <div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
        <h1 class="display-4">Букмаркет</h1>
        <a href="{% url 'catalog:product_create' %}" class="btn btn-primary">Добавить книгу</a>

            <p>Добро пожаловать на сайт!</p>
        {% endif %}

    </div>
</header>
