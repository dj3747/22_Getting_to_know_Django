{% extends "catalog/base.html" %}
{% load static %}
{% block title %}Добавление книги{% endblock %}

{% block content %}
<h2>Форма для книги</h2>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-primary">Сохранить</button>
  <a href="{% url 'catalog:products_list' %}" class="btn btn-secondary">Отменить</a>
</form>
{% endblock %}
